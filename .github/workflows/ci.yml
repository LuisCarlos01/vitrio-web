name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vitrio-web
      - uses: actions/checkout@v4
        with:
          repository: LuisCarlos01/vitrio-api
          path: vitrio-api

      - name: Start vitrio-api (docker compose)
        working-directory: vitrio-api
        run: |
          echo "VITRIO_CORS_ALLOWED_ORIGINS=http://localhost:3000" >> .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v3/api-docs > /dev/null && exit 0
            sleep 2
          done
          echo "vitrio-api did not become healthy in time" >&2
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vitrio-web/pnpm-lock.yaml

      - working-directory: vitrio-web
        run: pnpm install --frozen-lockfile
      - working-directory: vitrio-web
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: vitrio-web
        run: pnpm run test:e2e

      - name: Stop vitrio-api
        if: always()
        working-directory: vitrio-api
        run: docker compose down -v
